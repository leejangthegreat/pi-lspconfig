name: Publish

# Tag-driven: `dev` is the development branch (ci.yml), `main` is the release
# line. To release, merge dev into main and tag there — a tag on a dev-only
# commit is rejected by the ancestry gate below:
#   git switch main && git merge dev
#   npm version patch -m "Release %s" && git push --follow-tags
on:
  push:
    tags: ["v*"]

# Trusted publishing: npm exchanges the GitHub OIDC token for a short-lived
# publish credential. No NPM_TOKEN secret exists or is needed.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The ancestry gate below needs origin/main; a shallow clone of the
          # tag would not have it.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Node 22 ships npm 10.x; trusted publishing needs >= 11.5.1.
      - name: Install an npm that supports trusted publishing
        run: npm install -g npm@latest

      # A tag that disagrees with package.json would publish the wrong version.
      # Tag pushes do not trigger ci.yml, so this workflow is its own gate.
      - name: Tag must match package.json
        run: |
          expected="v$(node -p 'require("./package.json").version')"
          if [ "$expected" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $expected" >&2
            exit 1
          fi

      # `on.push.tags` matches the ref name only, so a tag on an unmerged
      # branch would otherwise publish code that never passed CI on main.
      - name: Tag must point at a commit on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "tag $GITHUB_REF_NAME points at $(git rev-parse --short HEAD), which is not an ancestor of main" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run docs:languages && git diff --exit-code docs/languages.md

      - name: Publish to npm
        run: npm publish
