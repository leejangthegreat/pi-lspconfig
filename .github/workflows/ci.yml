name: CI

on:
  # dev is the high-frequency branch; main is the release line. Pull requests
  # are covered regardless of their base branch.
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  real-servers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Install vtsls and pyright
        run: npm install -g @vtsls/language-server typescript pyright

      - name: Install rust-analyzer
        run: rustup component add rust-analyzer

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install gopls
        run: |
          go install golang.org/x/tools/gopls@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Real-server smoke tests
        run: PI_LSP_REAL=1 npx vitest run tests/integration/real-servers
